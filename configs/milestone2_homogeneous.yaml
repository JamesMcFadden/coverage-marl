run_name: milestone2_homogeneous

env:
  num_roles: 1
  num_agents: 4
  num_sites: 6
  world_size: 100.0
  max_steps: 200
  service_radius: 6.0
  comm_range: 20.0
  expire_after_detect: 50

train:
  total_timesteps: 300000
  rollout_length: 2048
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  epochs: 4
  minibatch_size: 256
  lr: 0.0003
  hidden_dim: 64
  seed: 0
